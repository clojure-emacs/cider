version: 2.1

orbs:
  win: circleci/windows@2.2.0

# Default actions to perform on each Emacs version
commands:
  # Eldev keeps the project's dependencies under .eldev/ and its own
  # bootstrap plus the package-archive contents under ~/.cache/eldev.
  # Both are cached per job, keyed on the files that decide what gets
  # installed, and rotated monthly so the MELPA snapshot doesn't go stale.
  # The project's own package (.eldev/*/local) is rebuilt every run and
  # must not come from the cache.
  restore-eldev-cache:
    steps:
      - run:
          name: Compute the cache month
          command: date +%Y-%m > .cache-month
      - restore_cache:
          keys:
            - eldev-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".cache-month" }}-{{ checksum "Eldev" }}-{{ checksum "lisp/cider.el" }}
            - eldev-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".cache-month" }}-
      - run:
          name: Drop the cached project package
          command: rm -rf .eldev/*/local

  save-eldev-cache:
    steps:
      - save_cache:
          key: eldev-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".cache-month" }}-{{ checksum "Eldev" }}-{{ checksum "lisp/cider.el" }}
          paths:
            - .eldev
            - ~/.cache/eldev

  setup:
    steps:
      - checkout
      - restore-eldev-cache
      - run:
          name: Install Eldev
          command: curl -fsSL https://raw.github.com/doublep/eldev/master/webinstall/circle-eldev > x.sh && source ./x.sh
      - run:
          name: Install unzip
          command: apt-get update && apt-get install unzip

  macos-setup:
    steps:
      - checkout
      - restore-eldev-cache
      - run:
          name: Install Emacs latest
          command: |
            brew install --cask emacs
      - run:
          name: Install Eldev
          command: curl -fsSL https://raw.github.com/doublep/eldev/master/webinstall/circle-eldev > x.sh && source ./x.sh

  # On Windows Emacs resolves ~ differently from the shell, so only the
  # project-local dependency directory is cached there.
  restore-eldev-cache-windows:
    steps:
      - run:
          name: Compute the cache month
          command: Get-Date -Format "yyyy-MM" | Out-File -FilePath .cache-month -Encoding ascii
      - restore_cache:
          keys:
            - eldev-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".cache-month" }}-{{ checksum "Eldev" }}-{{ checksum "lisp/cider.el" }}
            - eldev-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".cache-month" }}-
      - run:
          name: Drop the cached project package
          shell: bash.exe
          command: rm -rf .eldev/*/local

  save-eldev-cache-windows:
    steps:
      - save_cache:
          key: eldev-v1-{{ .Environment.CIRCLE_JOB }}-{{ checksum ".cache-month" }}-{{ checksum "Eldev" }}-{{ checksum "lisp/cider.el" }}
          paths:
            - .eldev

  setup-windows:
    steps:
      - checkout
      - restore-eldev-cache-windows
      - run:
          name: Install Eldev
          command: |
            (iwr https://raw.github.com/doublep/eldev/master/webinstall/circle-eldev.ps1).Content | powershell -command -
  test:
    steps:
      - run:
          name: Run regression tests
          command: eldev -dtT -p test
  lint:
    steps:
      - run:
          name: Run Elisp-lint
          command: eldev lint -c
      - run:
          name: Byte-compile .el files
          command: eldev -dtT compile --warnings-as-errors

jobs:
  test-ubuntu-emacs-28:
    docker:
      - image: silex/emacs:28-ci
        entrypoint: bash
    steps:
      - setup
      - test
      - save-eldev-cache

  test-ubuntu-emacs-29:
    docker:
      - image: silex/emacs:29-ci
        entrypoint: bash
    steps:
      - setup
      - test
      - save-eldev-cache

  test-ubuntu-emacs-30:
    docker:
      - image: silex/emacs:30-ci
        entrypoint: bash
    steps:
      - setup
      - test
      - save-eldev-cache

  test-macos-emacs-latest:
    macos:
      xcode: "16.4.0"
    steps:
      - macos-setup
      - test
      - save-eldev-cache

  test-windows-emacs-latest:
    executor: win/default
    steps:
      - run:
          name: Install Emacs latest
          command: |
            choco install emacs -y
      - setup-windows
      - test
      - save-eldev-cache-windows

  test-lint:
    docker:
      - image: silex/emacs:28-ci
    steps:
      - setup
      - lint
      - save-eldev-cache

workflows:
  version: 2.1
  ci-test-matrix:
    jobs:
      - test-lint
      - test-ubuntu-emacs-28:
          requires:
            - test-lint
      - test-ubuntu-emacs-29:
          requires:
            - test-lint
      - test-ubuntu-emacs-30:
          requires:
            - test-lint
      - test-windows-emacs-latest:
          requires:
            - test-lint
      - test-macos-emacs-latest:
          requires:
            - test-lint
