name: cider
title: CIDER
# The docs version comes from the git ref: a release tag like v2.1.0 becomes
# 2.1 (patch versions never appear in the docs), anything else is unversioned,
# which makes master the site's default version.  So a release doesn't have to
# touch this.  docs.cider.mx names the unversioned docs "master" in its version
# menu; doing that here with display_version would stick to every release.
version:
  v(?<major>+({0..9})).(?<minor>+({0..9})).*: $<major>.$<minor>
  '*': ~
nav:
- modules/ROOT/nav.adoc
asciidoc:
  attributes:
    # Versions quoted in the manual's setup snippets.  Keep them in sync with
    # what CIDER injects: cider-required-middleware-version and
    # cider-injected-nrepl-version in lisp/cider-jack-in.el, the piggieback
    # entry in cider-jack-in-cljs-dependencies, and
    # cider-minimum-clojure-version.  Pages reference them as
    # {cider-nrepl-version} and so on (code blocks need subs="attributes+").
    cider-nrepl-version: '0.64.0-alpha3'
    nrepl-version: '1.7.0'
    piggieback-version: '0.8.0'
    clojure-min-version: '1.10'
